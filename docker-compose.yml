services:
  db_core:
    image: postgres:15-alpine
    container_name: factoria_db_core
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: factoria_proyectos
    ports:
      - "127.0.0.1:5433:5432"
    command: postgres -c shared_buffers=128MB -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factoria_proyectos"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  flyway_migrator:
    image: flyway/flyway:9-alpine
    container_name: factoria_db_migrator
    depends_on:
      db_core:
        condition: service_healthy
    command: -url=jdbc:postgresql://db_core:5432/factoria_proyectos -user=postgres -password=${POSTGRES_PASSWORD} migrate
    volumes:
      - ./migraciones:/flyway/sql
    restart: "no"

volumes:
  pgdata:
