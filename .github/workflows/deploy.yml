name: Deploy Database to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Publicar sin bajar la base
        run: |
          dest=/home/ubuntu/enterprisesolutionstech-db
          mkdir -p "$dest"
          rsync -a --exclude .env --exclude .git ./ "$dest/"
          cd "$dest"
          docker compose up -d db_core
          docker compose up -d --no-deps --force-recreate flyway_migrator
          docker compose logs --tail 50 flyway_migrator
